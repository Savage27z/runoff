<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>RUNOFF</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
	<style>
		/* The loading screen: here, so it shows before anything else arrives. A dusk skyline, the logo, and a runner
		   dashing along the rooftops as the progress, hopping the gaps between them. */
		html, body { margin: 0; height: 100%; overflow: hidden; background: #120d1f; }
		#loading {
			position: fixed; inset: 0; z-index: 50; overflow: hidden; color: #f4f1ea;
			font: 500 15px/1.3 'Space Grotesk', system-ui, sans-serif;
			background: linear-gradient(180deg, #23194a 0%, #6b2f6e 38%, #d9586a 64%, #ff9a5c 78%, #2a1630 79%, #120d1f 100%);
			transition: opacity 450ms ease, visibility 450ms;
		}
		#loading.done { opacity: 0; visibility: hidden; }
		#loading .sun {
			position: absolute; left: 62%; top: 52%; width: 22vmin; height: 22vmin; border-radius: 50%;
			background: radial-gradient(circle, #ffd9a0 0%, #ff9a5c 55%, rgba(255, 120, 80, 0) 72%);
			transform: translate(-50%, -50%);
		}
		#loading .sun::after {
			content: ''; position: absolute; inset: 0; border-radius: 50%;
			background: repeating-linear-gradient(180deg, transparent 0 58%, #6b2f6e 58% 62%, transparent 62% 70%, #6b2f6e 70% 75%, transparent 75% 82%, #6b2f6e 82% 88%);
			mix-blend-mode: multiply; opacity: 0.6;
		}
		#loading svg.city { position: absolute; left: 0; bottom: 0; width: 100%; height: 34vh; }
		#loading .brand { position: absolute; left: 7vw; top: 13vh; }
		#loading .logo {
			font: 400 clamp(64px, 12vw, 168px)/0.82 'Anton', Impact, sans-serif; letter-spacing: 0.01em;
			transform: skewX(-9deg); transform-origin: left bottom; text-shadow: 0 10px 40px rgba(18, 13, 31, 0.6);
		}
		#loading .logo b { font-weight: 400; color: #ff5a1f; position: relative; display: inline-block; }
		#loading .logo b::after {
			content: ''; position: absolute; left: -4%; right: -6%; top: 52%; height: 0.07em; background: #120d1f;
			transform: rotate(-8deg); box-shadow: 0 0 0 0.02em #ff5a1f;
		}
		#loading .sub { margin-top: 18px; letter-spacing: 0.32em; text-transform: uppercase; font-size: 13px; color: rgba(244, 241, 234, 0.75); }
		#loading .lines { position: absolute; left: 7vw; top: calc(13vh - 18px); display: grid; gap: 6px; }
		#loading .lines i { display: block; height: 3px; background: #ff5a1f; border-radius: 2px; animation: dash 1.1s ease-in-out infinite; }
		#loading .lines i:nth-child(2) { width: 46px; animation-delay: 0.12s; opacity: 0.6; }
		#loading .lines i:nth-child(1) { width: 84px; }
		#loading .lines i:nth-child(3) { width: 22px; animation-delay: 0.24s; opacity: 0.35; }
		@keyframes dash { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
		#loading .runner { position: absolute; bottom: 0; left: 0; width: 34px; height: 46px; transition: left 260ms ease-out, bottom 260ms ease-out; }
		#loading .runner svg { width: 100%; height: 100%; overflow: visible; animation: bob 0.32s ease-in-out infinite alternate; }
		#loading .runner .leg-a { transform-origin: 17px 26px; animation: stride 0.32s ease-in-out infinite alternate; }
		#loading .runner .leg-b { transform-origin: 17px 26px; animation: stride 0.32s ease-in-out infinite alternate-reverse; }
		#loading .runner .arm-a { transform-origin: 18px 14px; animation: stride 0.32s ease-in-out infinite alternate-reverse; }
		#loading .runner .arm-b { transform-origin: 18px 14px; animation: stride 0.32s ease-in-out infinite alternate; }
		#loading .runner.air svg { animation: none; transform: rotate(-12deg); }
		@keyframes stride { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }
		@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
		#loading .trail { position: absolute; bottom: 0; left: 0; height: 3px; background: linear-gradient(90deg, rgba(255, 90, 31, 0), #ff5a1f); border-radius: 2px; transition: width 260ms ease-out, bottom 260ms ease-out; }
		#loading .foot { position: absolute; left: 7vw; right: 7vw; bottom: 3.2vh; display: flex; align-items: baseline; gap: 16px; font-size: 13px; }
		#loading .status { letter-spacing: 0.18em; text-transform: uppercase; color: rgba(244, 241, 234, 0.8); }
		#loading .pct { font: 700 13px 'JetBrains Mono', ui-monospace, monospace; color: #ff5a1f; }
		#loading .tip { margin-left: auto; color: rgba(244, 241, 234, 0.6); max-width: 46ch; text-align: right; }
		#loading .tip b { color: #f4f1ea; font-weight: 700; }
		#loading.failed .status { color: #ffb545; text-transform: none; letter-spacing: 0; }
		/* Loaded again later (another course, another runner): over the game, lighter. */
		#loading.again { background: rgba(18, 13, 31, 0.86); }
		#loading.again .sun, #loading.again .brand, #loading.again .lines { display: none; }
	</style>
</head>
<body>
	<div id="app"></div>
	<div id="ui"></div>

	<div id="loading">
		<div class="sun"></div>
		<div class="lines"><i></i><i></i><i></i></div>
		<div class="brand">
			<div class="logo">RUN<b>OFF</b></div>
			<div class="sub">rooftop parkour · time trials</div>
		</div>
		<svg class="city" preserveAspectRatio="none"></svg>
		<div class="trail"></div>
		<div class="runner">
			<svg viewBox="0 0 34 46" fill="none" stroke="#f4f1ea" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
				<circle cx="21" cy="6" r="4.5" fill="#f4f1ea" stroke="none" />
				<path d="M19 12 L17 26" />
				<path class="arm-a" d="M18 14 L10 20 L6 16" />
				<path class="arm-b" d="M18 14 L26 18 L30 13" stroke="#ff5a1f" />
				<path class="leg-a" d="M17 26 L11 34 L13 43" />
				<path class="leg-b" d="M17 26 L24 33 L21 43" stroke="#ff5a1f" />
			</svg>
		</div>
		<div class="foot">
			<span class="status" id="loading-text">Warming up</span>
			<span class="pct" id="loading-pct">0%</span>
			<span class="tip" id="loading-tip"></span>
		</div>
	</div>

	<script>
		// The loading screen's skyline (a row of rooftops with gaps between them, windows lit) and its progress: the
		// runner along the roofs, the trail behind it. window.loading is how the game reports.
		( () => {

			const el = document.getElementById( 'loading' ), svg = el.querySelector( 'svg.city' );
			const runner = el.querySelector( '.runner' ), trail = el.querySelector( '.trail' );
			const W = 1000, H = 100;
			svg.setAttribute( 'viewBox', `0 0 ${W} ${H}` );
			let seed = 7;
			const rand = () => ( seed = ( seed * 16807 ) % 2147483647 ) / 2147483647;
			const roofs = [];
			let parts = '', x = -10;
			while ( x < W + 10 ) {

				const w = 40 + rand() * 90, h = 28 + rand() * 46;
				roofs.push( { x0: x, x1: x + w, top: H - h } );
				parts += `<rect x="${x.toFixed( 1 )}" y="${( H - h ).toFixed( 1 )}" width="${w.toFixed( 1 )}" height="${h.toFixed( 1 )}" fill="#1a1126"/>`;
				for ( let wx = x + 6; wx < x + w - 8; wx += 9 ) for ( let wy = H - h + 8; wy < H - 4; wy += 9 ) {

					if ( rand() < 0.28 ) parts += `<rect x="${wx.toFixed( 1 )}" y="${wy.toFixed( 1 )}" width="3.2" height="4.2" fill="${rand() < 0.7 ? '#ffb26b' : '#9fd0ff'}" opacity="${( 0.45 + rand() * 0.5 ).toFixed( 2 )}"/>`;

				}

				parts += `<rect x="${x.toFixed( 1 )}" y="${( H - h - 1.6 ).toFixed( 1 )}" width="${w.toFixed( 1 )}" height="1.6" fill="#ff5a1f" opacity="0.35"/>`;
				x += w + 6 + rand() * 14;

			}

			svg.innerHTML = parts;
			const tips = [
				'<b>Slide</b> then jump: the slide\'s boost carries over the gap.',
				'Run into a waist-high wall: you <b>vault</b> it without slowing.',
				'Jump at a wall at a shallow angle to <b>wall-run</b>, then <b>Space</b> to kick off.',
				'Big drop? Hold <b>Space</b> as you land to <b>roll</b> it.',
				'Jump up at a cable to ride the <b>zipline</b>.',
				'<b>Q</b> takes you back to the last checkpoint; <b>R</b> restarts the run.',
				'Every medal is a star. Stars open new courses.',
			];
			const tip = document.getElementById( 'loading-tip' );
			let t = Math.floor( Math.random() * tips.length );
			const nextTip = () => tip.innerHTML = `Tip · ${tips[ t ++ % tips.length ]}`;
			nextTip();
			const tipTimer = setInterval( nextTip, 3800 );

			// The runner at a share of the way along: on the roof below it, in the air over a gap.
			const place = ( share ) => {

				const rect = svg.getBoundingClientRect(), px = 0.07 + share * 0.86;
				const vx = px * W, roof = roofs.find( ( r ) => vx >= r.x0 && vx <= r.x1 );
				const top = roof ? roof.top : Math.min( ...roofs.filter( ( r ) => Math.abs( r.x0 - vx ) < 30 || Math.abs( r.x1 - vx ) < 30 ).map( ( r ) => r.top ) ) - 9;
				const y = rect.height * ( 1 - top / H );
				runner.style.left = `${px * rect.width - 17}px`;
				runner.style.bottom = `${y - 2}px`;
				runner.classList.toggle( 'air', ! roof );
				trail.style.left = `${0.07 * rect.width}px`;
				trail.style.width = `${Math.max( 0, ( px - 0.07 ) * rect.width - 10 )}px`;
				trail.style.bottom = `${y + 20}px`;

			};

			let share = 0, steps = 0, expected = 10;
			place( 0 );
			window.loading = {
				/** A step of the load done, named. */
				step( text ) {

					document.getElementById( 'loading-text' ).textContent = text.replace( /…$/, '' );
					share = Math.min( 0.95, ++ steps / expected );
					document.getElementById( 'loading-pct' ).textContent = `${Math.round( share * 100 )}%`;
					place( share );

				},
				/** Shown again over the game, for a load of `count` steps. */
				show( text, count = 6 ) {

					steps = 0;
					expected = count;
					el.classList.add( 'again' );
					el.classList.remove( 'done', 'failed' );
					this.step( text );

				},
				done() {

					share = 1;
					document.getElementById( 'loading-pct' ).textContent = '100%';
					place( 1 );
					setTimeout( () => el.classList.add( 'done' ), 220 );

				},
				fail( message ) {

					el.classList.add( 'failed' );
					document.getElementById( 'loading-text' ).textContent = message;
					clearInterval( tipTimer );

				},
			};
			addEventListener( 'resize', () => place( share ) );

		} )();
	</script>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
